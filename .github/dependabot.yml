# Keeps the action versions and NuGet packages patched. Actions are pinned by
# major tag rather than commit SHA; Dependabot is what makes that safe, because
# a compromised or vulnerable release gets a bump PR instead of sitting behind
# a mutable tag forever.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repo; never grant the default token more.
# Note this uses pull_request, not pull_request_target: a fork's PR therefore
# runs without repository secrets and without write access.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Do not leave the job token in .git/config on the runner; nothing
          # here pushes, so the credential is never needed after checkout.
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Boots the built app and exercises its HTTP surface end to end,
      # including failure conditions - the class of hosting/config breakage
      # unit tests cannot see.
      - name: HTTP smoke test
        shell: pwsh
        run: ./tools/smoke-test.ps1 -StartServer

name: Deploy to Azure

# Publishes the Blazor Server app to an Azure App Service (Free F1) web app.
#
# Authentication is OIDC only: the workflow requests a short-lived federated
# token from GitHub at run time and exchanges it with Microsoft Entra ID. There
# is NO publish profile, NO AZURE_CREDENTIALS blob and NO long-lived secret of
# any kind stored in the repo or in GitHub. The only values GitHub holds are
# three non-sensitive identifiers (client / tenant / subscription IDs) that are
# useless without the federated-credential trust configured on the Azure side.
#
# Setup (one time): see docs/deployment.md.

on:
  push:
    branches: [main]
    # Docs-only changes never touch the deployed app, so skip them.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  workflow_dispatch: {}

# Least privilege at the top level; the deploy job elevates only id-token.
permissions:
  contents: read

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: Sudoku/Sudoku.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Gate the deploy on the same tests CI runs, so main can never ship red.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --no-build --output ${{ github.workspace }}/publish

      # Fail fast if publish did not produce a runnable app. The entry assembly
      # (Sudoku.dll) must sit at the package ROOT — that is what unzips to
      # /home/site/wwwroot and what App Service starts. If it is missing, the
      # deploy would populate the web root with the wrong thing and boot-loop.
      - name: Verify publish output
        run: |
          root="${{ github.workspace }}/publish"
          if [ ! -f "$root/Sudoku.dll" ] || [ ! -f "$root/Sudoku.runtimeconfig.json" ]; then
            echo "::error title=Publish check failed::Sudoku.dll / runtimeconfig not at publish root — refusing to deploy."
            ls -la "$root" || true
            exit 1
          fi
          echo "Publish OK — entry assembly present, $(ls -1 "$root" | wc -l) entries at root."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ${{ github.workspace }}/publish
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 'production' lets you add required reviewers / branch limits in repo
    # settings later without touching this file. Safe to leave as-is.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write        # required for the OIDC federated token
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Azure login (OIDC — no stored credential)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Sign out
        if: always()
        run: az logout || true

  # Proves the freshly deployed site actually serves traffic. The deploy job
  # can go green while the app boot-loops (bad startup command, missing entry
  # assembly, runtime config drift) — App Service reports the *deployment* as
  # succeeded, not the *app*. This job hits the real public URL and fails the
  # whole run if the live site is unhealthy, so a broken release shows up red
  # instead of silently sitting live.
  #
  # It re-runs the exact same HTTP checks CI runs locally, but against the
  # production URL. No Azure credentials or OIDC token — it only makes public
  # HTTP requests, so it needs nothing beyond checking out the test script.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Prefer the explicit APP_URL variable the provisioning script sets; fall
      # back to the conventional <app>.azurewebsites.net host if only the web
      # app name is configured. Fail loudly if neither is set rather than
      # smoke-testing a blank URL.
      - name: Resolve live URL
        run: |
          url="${{ vars.APP_URL }}"
          if [ -z "$url" ]; then
            name="${{ vars.AZURE_WEBAPP_NAME }}"
            if [ -z "$name" ]; then
              echo "::error title=No smoke target::Neither the APP_URL nor AZURE_WEBAPP_NAME repository variable is set."
              exit 1
            fi
            url="https://${name}.azurewebsites.net"
          fi
          url="${url%/}"                       # drop any trailing slash
          echo "LIVE_URL=$url" >> "$GITHUB_ENV"
          echo "Smoke target: $url"

      # A fresh deploy on the Free (F1) tier cold-starts, so the first requests
      # can hang or 5xx for up to a minute. Poll GET / until it answers 200
      # (up to ~5 minutes) before running the checks, so a slow wake-up is not
      # mistaken for a failed release.
      - name: Wait for the app to answer (F1 cold start)
        run: |
          url="$LIVE_URL"
          echo "Polling $url/ for readiness..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Ready after attempt $i (HTTP 200)."
              exit 0
            fi
            echo "attempt $i: HTTP $code — waiting 10s"
            sleep 10
          done
          echo "::error title=App never became ready::$url did not return HTTP 200 within ~5 minutes."
          exit 1

      - name: Run HTTP smoke test against the live site
        shell: pwsh
        run: ./tools/smoke-test.ps1 -BaseUrl "$env:LIVE_URL"
